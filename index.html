<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Экономика — вопросы к экзамену</title>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --text:#161a21; --muted:#6b7688;
  --line:#dfe4ec; --accent:#3b6ef6; --green:#16a34a; --green-soft:#e6f7ec;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --text:#e9edf4; --muted:#94a0b4;
  --line:#252b35; --accent:#6f97ff; --green:#34d399; --green-soft:#12291f;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:70px; overscroll-behavior-y:none;
}
button,input{font-family:inherit}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:840px;margin:0 auto;padding:10px 14px 9px;display:flex;align-items:center;gap:11px}
.logo{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;color:#fff;font-weight:800;font-size:17px;
  display:grid;place-items:center;background:linear-gradient(135deg,#3b6ef6,#7c5cff);
  box-shadow:0 4px 12px rgba(59,110,246,.35);
}
.grow{flex:1;min-width:0}
h1{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.icon{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:17px;cursor:pointer;line-height:1;
  display:grid;place-items:center;transition:transform .15s;
}
.icon:active{transform:scale(.92)}
.bar{height:4px;background:var(--line);overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#3b6ef6,#22c55e);transition:width .35s ease}

.wrap{max-width:840px;margin:0 auto;padding:0 14px}
.toolbar{padding:12px 0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;
  transition:all .15s;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,110,246,.3)}
#search{
  width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
#search:focus{border-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:10px}
.mini{
  padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;
}
.mini.danger{color:#e0574f;border-color:rgba(224,87,79,.35)}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}
.sec-name{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s;
}
.card.done{border-color:var(--green)}
.q{display:flex;gap:11px;align-items:flex-start;padding:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.q:active{background:rgba(128,128,128,.06)}
.num{
  flex:0 0 auto;min-width:27px;height:27px;padding:0 6px;border-radius:9px;background:var(--bg);
  color:var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:750;
  font-variant-numeric:tabular-nums;transition:all .2s;
}
.card.done .num{background:var(--green-soft);color:var(--green)}
.qtitle{flex:1;font-weight:650;font-size:15px;line-height:1.42;padding-top:2px}
.chev{flex:0 0 auto;width:18px;height:18px;position:relative;margin-top:5px;opacity:.45;transition:transform .25s}
.chev::before{
  content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);border-radius:1px;
}
.card.open .chev{transform:rotate(180deg)}

.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.card.open .a{grid-template-rows:1fr}
.a-in{overflow:hidden;min-height:0}
.a-body{padding:2px 15px 0;font-size:14.5px;line-height:1.68;color:var(--text)}
.a-body p{margin:.6em 0}
.a-body ul{margin:.6em 0;padding-left:1.15em}
.a-body li{margin:.35em 0}
.a-body li::marker{color:var(--accent)}
.a-body b{font-weight:700}
.a-body .note{
  display:block;margin:.9em 0;padding:9px 12px;border-left:3px solid var(--accent);
  background:rgba(59,110,246,.07);border-radius:0 8px 8px 0;font-size:14px;
}
.a-body code{
  background:var(--bg);padding:2px 6px;border-radius:5px;font-size:13.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.a-body table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:13.5px}
.a-body th,.a-body td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.a-body th{background:var(--bg);font-weight:700}

.learn{
  display:block;margin:14px 15px 15px;padding:9px 15px;border-radius:11px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:13px;font-weight:650;cursor:pointer;transition:all .18s;
}
.learn:active{transform:scale(.97)}
.card.done .learn{background:var(--green-soft);border-color:transparent;color:var(--green)}

.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 14px 10px;opacity:.8}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">Э</div>
    <div class="grow">
      <h1>Экономика · экзамен</h1>
      <div class="sub" id="progressText">0 из 44</div>
    </div>
    <button class="icon" id="themeBtn" title="Сменить тему">🌙</button>
  </div>
  <div class="bar"><div id="barFill"></div></div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="chips" id="chips">
      <button class="chip active" data-sec="all">Все</button>
      <button class="chip" data-sec="know">Знать</button>
      <button class="chip" data-sec="can">Уметь</button>
      <button class="chip" data-sec="master">Владеть</button>
    </div>
    <input id="search" type="search" placeholder="Поиск по темам и тексту…" autocomplete="off">
    <div class="actions">
      <button class="mini" id="collapseBtn">Свернуть всё</button>
      <button class="mini danger" id="resetBtn">Сбросить прогресс</button>
    </div>
  </div>
  <main id="list"></main>
  <footer>Прогресс сохраняется в браузере · работает офлайн</footer>
</div>

  body:`
  <p><b>Экономический кругооборот</b> — модель движения товаров, ресурсов, доходов и расходов между субъектами экономики. «Расширенная» означает, что в неё включены не только домохозяйства и фирмы (как в простой двухсекторной модели), но и <b>государство</b> и <b>заграница</b>.</p>

  <p><b>Четыре макроэкономических субъекта:</b></p>
  <ul>
    <li><b>Домохозяйства</b> — владеют факторами производства (труд, капитал, земля, предпринимательская способность), предоставляют их фирмам и получают факторные доходы: заработную плату, процент, ренту, прибыль. Полученный доход распределяют на потребление (C), сбережения (S) и уплату налогов (T).</li>
    <li><b>Фирмы</b> — покупают ресурсы на рынке факторов, производят товары и услуги, продают их на рынке благ, получают выручку. Расходуют средства на оплату ресурсов, инвестиции (I) и налоги (T).</li>
    <li><b>Государство</b> — собирает налоги (T), осуществляет государственные закупки (G), выплачивает трансферты домохозяйствам и фирмам (субсидии, пенсии, пособия), занимает на финансовом рынке.</li>
    <li><b>Заграница</b> — участвует через экспорт (X) и импорт (M) товаров и услуг, а также через международное движение капитала.</li>

  <p><b>Два рынка:</b> рынок ресурсов (факторов производства) и рынок благ (товаров и услуг). Плюс финансовый рынок, где сбережения превращаются в инвестиции.</p>

  <p><b>Утечки (изъятия) из потока доходов</b> — то, что не возвращается фирмам напрямую:</p>

  <p class="note"><b>Условие макроэкономического равновесия кругооборота:</b> утечки = инъекции, то есть <code>S + T + M = I + G + X</code>. Если утечки больше инъекций — совокупный спрос падает, экономика замедляется; если инъекции больше утечек — возникает инфляционное давление.</p>

  <p><b>Значение модели:</b> она показывает, что ВВП можно измерить с трёх сторон — по расходам, по доходам и по добавленной стоимости, и что все три потока в итоге сходятся в одной величине.</p>`

  <p>Современные системы чаще всего смешанные: даже в США государство регулирует экономику, а в Китае при формально социалистической модели активно работают рыночные механизмы.</p>`

{
  section:'know',
  title:'Модель рыночного равновесия',
  body:`
  <p><b>Рыночное равновесие</b> — состояние рынка, при котором величина спроса равна величине предложения: <code>Qd = Qs</code>. Графически это точка пересечения кривых D и S.</p>

  <p><b>Параметры равновесия:</b></p>
  <ul>
    <li><b>Равновесная цена Pe</b> — цена, при которой рынок «очищается», нет ни дефицита, ни излишка.</li>
    <li><b>Равновесный объём Qe</b> — количество товара, реально продаваемое по этой цене.</li>
  </ul>

  <p><b>Отклонения от равновесия:</b></p>
  <ul>
    <li><b>Цена выше равновесной</b> → Qs > Qd → образуется <b>излишек (затоваривание)</b>. Продавцы вынуждены снижать цену, и рынок возвращается к равновесию.</li>
    <li><b>Цена ниже равновесной</b> → Qd > Qs → образуется <b>дефицит</b>. Покупатели готовы платить больше, цена растёт, равновесие восстанавливается.</li>
  </ul>

  <p class="note"><b>Важно различать:</b> изменение самой цены — это <b>движение вдоль</b> кривой; изменение неценовых факторов (дохода, технологий, вкусов и т.д.) — это <b>сдвиг</b> кривой и переход к новой точке равновесия.</p>

  <p><b>Паутинообразная модель</b> описывает случай, когда производители ориентируются на цены прошлого периода. Тогда цена и объём колеблются вокруг равновесия: если эластичность предложения меньше эластичности спроса — колебания затухают; если больше — усиливаются; если равны — возникают устойчивые циклические колебания.</p>

  <p><b>Применение:</b> модель используется для анализа последствий налогов, субсидий, дотаций, введения цен «пола» и «потолка», экспортных и импортных пошлин.</p>`

{
  section:'know',
  title:'Равновесие потребителя',
  body:`
  <p><b>Равновесие потребителя</b> — такое распределение дохода между товарами, при котором потребитель максимизирует совокупную полезность при заданном бюджетном ограничении.</p>

  <p><b>Условие равновесия (кардиналистский подход):</b> <code>MUx / Px = MUy / Py = … = λ</code>, где MU — предельная полезность, P — цена, λ — предельная полезность денег. Смысл: последний рубль, потраченный на каждый товар, должен давать одинаковую полезность. Если MUx/Px > MUy/Py, потребитель переключится с Y на X, пока равенство не восстановится.</p>

  <p><b>Ординалистский подход</b> использует:</p>
  <ul>
    <li><b>Кривые безразличия</b> — множество наборов, дающих одинаковую полезность. Свойства: отрицательный наклон, выпуклость к началу координат, не пересекаются, чем дальше от начала — тем выше полезность.</li>
    <li><b>Бюджетную линию</b> — множество наборов, доступных при данном доходе: <code>I = Px·X + Py·Y</code>. Наклон равен −Px/Py.</li>
  </ul>

  <p><b>Оптимум потребителя</b> — точка касания бюджетной линии и наивысшей достижимой кривой безразличия. В этой точке:</p>
  <ul>
    <li><code>MRSxy = Px / Py</code> — предельная норма замещения равна соотношению цен;</li>
    <li>наклоны кривой безразличия и бюджетной линии совпадают.</li>
  </ul>

  <p><b>Эффекты изменения цены:</b></p>
  <ul>
    <li><b>Эффект замены</b> — подорожавший товар замещается более дешёвым.</li>
    <li><b>Эффект дохода</b> — реальная покупательная способность меняется, что сказывается на объёме потребления.</li>
  </ul>

  <p>Для нормальных товаров оба эффекта действуют в одну сторону; для товаров Гиффена эффект дохода перевешивает эффект замены, и спрос на товар растёт при повышении цены.</p>`

{
  section:'know',
  title:'Равновесие производителя',
  body:`
  <p><b>Равновесие производителя</b> — состояние, при котором фирма при данном бюджете достигает максимального выпуска или при данном выпуске минимизирует издержки.</p>

  <p><b>Инструменты анализа:</b></p>
  <ul>
    <li><b>Изокванта</b> — кривая, показывающая все комбинации двух ресурсов (например, труда L и капитала K), дающие одинаковый выпуск Q. Свойства аналогичны кривым безразличия: отрицательный наклон, выпуклость, не пересекаются.</li>
    <li><b>Изокоста</b> — линия равных затрат: <code>C = w·L + r·K</code>, где w — ставка заработной платы, r — цена капитала. Наклон равен −w/r.</li>
  </ul>

  <p><b>Условие оптимума производителя:</b> точка касания изокванты и изокосты, в которой:</p>
  <p><code>MRTS_LK = MPL / MPK = w / r</code>, или эквивалентно <code>MPL / w = MPK / r</code>.</p>
  <p>Смысл: последний рубль, затраченный на каждый ресурс, должен давать одинаковый предельный продукт. Иначе фирма перераспределит ресурсы в пользу более отдачи.</p>

  <p><b>Два подхода к оптимуму:</b></p>
  <ul>
    <li><b>Минимизация издержек</b> при заданном выпуске — фирма «касается» самой низкой изокостой данной изокванты.</li>
    <li><b>Максимизация выпуска</b> при заданном бюджете — фирма касается самой высокой изоквантой данной изокосты.</li>
  </ul>

  <p><b>Максимизация прибыли</b> — отдельный принцип: фирма выбирает объём, при котором <code>MR = MC</code> (предельный доход равен предельным издержкам). Для совершенного конкурента MR = P, поэтому условие принимает вид P = MC.</p>

  <p><b>Эффект масштаба:</b> если при пропорциональном увеличении ресурсов выпуск растёт быстрее — положительный эффект масштаба (экономия); медленнее — отрицательный (рост издержек).</p>`
},
{
  section:'know',
  title:'Модели рыночных структур',
  body:`
  <p><b>Рыночная структура</b> определяется числом продавцов, типом продукта, высотой барьеров входа, степенью контроля над ценой и доступностью информации.</p>

  <table>
    <tr><th>Признак</th><th>Совершенная конкуренция</th><th>Монополистическая конкуренция</th><th>Олигополия</th><th>Монополия</th></tr>
    <tr><td>Число фирм</td><td>Очень много</td><td>Много</td><td>Несколько</td><td>Одна</td></tr>
    <tr><td>Тип продукта</td><td>Однородный</td><td>Дифференцированный</td><td>Однородный или дифференц.</td><td>Уникальный</td></tr>
    <tr><td>Барьеры входа</td><td>Отсутствуют</td><td>Низкие</td><td>Высокие</td><td>Очень высокие</td></tr>
    <tr><td>Контроль над ценой</td><td>Нет</td><td>Слабый</td><td>Частичный</td><td>Полный</td></tr>
    <tr><td>Пример</td><td>Зерно, ценные бумаги</td><td>Кафе, одежда, книги</td><td>Автомобили, связь</td><td>Электро-, водоснабжение</td></tr>
  </table>

  <p><b>Совершенная конкуренция.</b> Фирма — ценополучатель: P = MR. Максимизирует прибыль при P = MC. В долгосрочном периоде экономическая прибыль исчезает: P = min ATC.</p>

  <p><b>Монополистическая конкуренция.</b> Много фирм с дифференцированным продуктом, есть небольшой контроль над ценой, но вход свободен. В долгосрочном периоде прибыль стремится к нулю, но фирмы сохраняют «избыточные мощности» и тратят на рекламу.</p>

  <p><b>Олигополия.</b> Несколько крупных фирм, взаимозависимых в решениях. Модели: ломаная кривая спроса, дуополия Курно, модель Штакельберга, теория игр («дилемма заключённого»). Возможны ценовые войны, сговор, картели.</p>

  <p><b>Монополия.</b> Один продавец, барьеры практически непреодолимы. Оптимум монополиста: MR = MC, при этом P &gt; MC, объём ниже, а цена выше конкурентных. Возникает «мёртвый груз» — потеря общественного благосостояния.</p>

  <p><b>Показатели монопольной власти:</b> коэффициент Лернера (L = (P − MC)/P), индекс Херфиндаля–Хиршмана (сумма квадратов рыночных долей).</p>`
},
{
  section:'know',
  title:'Модель совершенной и несовершенной конкуренции на рынке труда',
  body:`
  <p>На рынке труда фирма сопоставляет предельный продукт труда в денежном выражении <code>MRP_L = MPL × P</code> с предельными издержками на труд (заработной платой w).</p>

  <p><b>Совершенная конкуренция на рынке труда:</b></p>
  <ul>
    <li>Много работодателей и работников, никто не влияет на ставку заработной платы — она задана рынком.</li>
    <li>Условие найма: <code>MRP_L = w</code>. Кривая MRP — это кривая спроса фирмы на труд.</li>
    <li>Равновесная ставка заработной платы и уровень занятости определяются пересечением рыночного спроса и рыночного предложения труда.</li>
  </ul>

  <p><b>Монопсония</b> — рынок, где единственный покупатель труда (например, градообразующее предприятие):</p>
  <ul>
    <li>предельные издержки на труд превышают ставку (MRC &gt; w), так как нанять дополнительного работника дороже, чем платить всем прежним;</li>
    <li>условие найма: <code>MRP_L = MRC</code>;</li>
    <li>результат: и занятость, и ставка заработной платы ниже конкурентных.</li>
  </ul>

  <p><b>Монополия профсоюза</b> — единственный продавец труда:</p>
  <ul>
    <li>ограничивает предложение труда (сокращает число членов, удлиняет рабочую неделю, требует лицензий);</li>
    <li>ставка заработной платы растёт, но занятость падает.</li>
  </ul>

  <p><b>Двусторонняя монополия</b> — монопсонист-работодатель и профсоюз-монополист. Ставка и занятость определяются переговорной силой сторон и могут попасть в диапазон между уровнями каждой из монополий.</p>

  <p><b>Государственное регулирование:</b> МРОТ, антидискриминационные нормы, охрана труда, пособия по безработице, программы переобучения.</p>`
},
{
  section:'know',
  title:'Концепция временной ценности денег',
  body:`
  <p><b>Временная ценность денег</b> — принцип, согласно которому одна и та же сумма денег сегодня стоит дороже, чем та же сумма в будущем, потому что сегодняшние деньги можно вложить и получить доход.</p>

  <p><b>Основные формулы:</b></p>
  <ul>
    <li><b>Начисление (компаундинг):</b> <code>FV = PV × (1 + r)ⁿ</code></li>
    <li><b>Дисконтирование:</b> <code>PV = FV / (1 + r)ⁿ</code></li>
    <li><b>Простые проценты:</b> <code>FV = PV × (1 + r × n)</code></li>
    <li><b>Непрерывное начисление:</b> <code>FV = PV × e^(r·n)</code></li>
  </ul>
  <p>Здесь PV — текущая стоимость, FV — будущая, r — ставка, n — число периодов.</p>

  <p><b>Аннуитет</b> — серия равных платежей. Текущая стоимость аннуитета: <code>PV = PMT × [1 − (1 + r)⁻ⁿ] / r</code>.</p>

  <p><b>Применение:</b></p>
  <ul>
    <li>оценка инвестиционных проектов (NPV, IRR, PI, срок окупаемости);</li>
    <li>сравнение альтернатив вложения капитала;</li>
    <li>расчёт платежей по кредитам и ипотеке;</li>
    <li>оценка стоимости бизнеса и активов;</li>
    <li>пенсионные и страховые расчёты.</li>
  </ul>

  <p class="note"><b>Ключевое правило:</b> чем выше ставка дисконтирования и чем дальше срок, тем меньше текущая стоимость будущих денег. Деньги, полученные быстро, ценятся выше.</p>`
},
{
  section:'know',
  title:'Земельная рента и её виды',
  body:`
  <p><b>Земельная рента</b> — доход, получаемый собственником земли за передачу её в пользование (арендатору). Экономическая природа ренты — избыток дохода сверх минимально необходимого для вовлечения земли в оборот.</p>

  <p><b>Виды ренты:</b></p>
  <ul>
    <li><b>Абсолютная рента</b> — возникает со всех участков независимо от их качества, из-за монополии частной собственности на землю. Собственник не отдаст землю бесплатно, даже если она худшая.</li>
    <li><b>Дифференциальная рента I</b> — образуется из-за различий в плодородии и местоположении участков. На лучших и средних участках издержки ниже, а цена продукции определяется по худшим условиям — возникает дополнительный доход.</li>
    <li><b>Дифференциальная рента II</b> — результат дополнительных вложений капитала в один и тот же участок (удобрения, механизация, мелиорация). Присваивается арендатором в течение срока аренды, затем учитывается в новой арендной плате.</li>
    <li><b>Монопольная рента</b> — на уникальные участки, где производятся редкие культуры или добываются особые ресурсы (виноградники, месторождения алмазов). Цена определяется не издержками, а платёжеспособным спросом.</li>
  </ul>

  <p><b>Цена земли</b> — капитализированная рента: <code>Цена земли = Рента / Ставка банковского процента × 100%</code>. Чем выше рента и ниже ставка процента, тем дороже земля.</p>

  <p><b>Распределение ренты:</b> собственник получает арендную плату (ренту), арендатор — предпринимательский доход, государство — земельный налог. Поскольку предложение земли неэластично, налог ложится в основном на собственника и не сокращает предложение земли.</p>`
},
{
  section:'know',
  title:'Общественное воспроизводство, национальное богатство. Потоки и запасы',
  body:`
  <p><b>Общественное воспроизводство</b> — непрерывно возобновляющийся процесс производства, распределения, обмена и потребления благ.</p>
  <p><b>Типы воспроизводства:</b></p>
  <ul>
    <li><b>Простое</b> — производство в прежних масштабах, весь доход идёт на потребление.</li>
    <li><b>Расширенное</b> — производство растёт, часть дохода идёт на накопление и инвестиции.</li>
    <li><b>Суженное</b> — производство сокращается (кризис, война, катастрофа).</li>
  </ul>

  <p><b>Национальное богатство</b> — совокупность материальных и нематериальных благ, накопленных обществом за всю историю:</p>
  <ul>
    <li>природные ресурсы (земля, недра, вода, леса);</li>
    <li>основной капитал (здания, оборудование, инфраструктура);</li>
    <li>оборотные средства и запасы;</li>
    <li>имущество домохозяйств;</li>
    <li>человеческий капитал (знания, здоровье, квалификация);</li>
    <li>нематериальные активы (патенты, бренды, культурные ценности).</li>
  </ul>

  <p><b>Потоки и запасы:</b></p>
  <table>
    <tr><th>Поток (за период)</th><th>Запас (на момент)</th></tr>
    <tr><td>ВВП, ВНП</td><td>Национальное богатство</td></tr>
    <tr><td>Инвестиции</td><td>Основной капитал</td></tr>
    <tr><td>Доход, сбережения</td><td>Накопленное богатство</td></tr>
    <tr><td>Дефицит бюджета</td><td>Государственный долг</td></tr>
    <tr><td>Экспорт, импорт</td><td>Золотовалютные резервы</td></tr>
  </table>

  <p class="note">Поток характеризует скорость изменения запаса. Например, инвестиции — поток, увеличивающий запас капитала; амортизация — поток, уменьшающий его.</p>`
},
{
  section:'know',
  title:'Роль государства в решении макроэкономических проблем',
  body:`
  <p>Государство выполняет в экономике ряд функций, направленных на достижение макроэкономической стабильности и роста благосостояния.</p>

  <p><b>Основные задачи:</b></p>
  <ul>
    <li><b>Экономический рост</b> — поддержание устойчивых темпов роста ВВП, стимулирование инвестиций и инноваций.</li>
    <li><b>Полная занятость</b> — снижение безработицы, создание рабочих мест, переобучение.</li>
    <li><b>Стабильность цен</b> — борьба с инфляцией и дефляцией через денежно-кредитную и фискальную политику.</li>
    <li><b>Сглаживание циклических колебаний</b> — стимулирующая политика в период спада, сдерживающая — при перегреве.</li>
    <li><b>Производство общественных благ</b> — оборона, правопорядок, инфраструктура, фундаментальная наука.</li>
    <li><b>Регулирование внешних эффектов</b> — налоги Пигу, субсидии, экологические нормативы.</li>
    <li><b>Перераспределение доходов</b> — прогрессивные налоги, трансферты, социальные программы.</li>
    <li><b>Защита конкуренции</b> — антимонопольная политика, регулирование естественных монополий.</li>
    <li><b>Стабилизация платёжного баланса и валютного курса</b>.</li>
  </ul>

  <p><b>Инструменты:</b> фискальная политика (налоги, госрасходы), денежно-кредитная политика (ставка, резервы, операции на открытом рынке), прямое регулирование (тарифы, квоты), институциональные меры (законы, стандарты).</p>

  <p><b>Ограничения:</b> временные лаги, политический цикл, бюрократия, риск «провалов государства» (неэффективность госрасходов, коррупция, искажение стимулов).</p>`
},
{
  section:'know',
  title:'Категория эффективности',
  body:`
  <p><b>Эффективность</b> — категория, отражающая соотношение полученного результата (эффекта) и затраченных ресурсов. Эффективность = результат / затраты.</p>

  <p><b>Виды эффективности:</b></p>
  <ul>
    <li><b>Экономическая</b> — соотношение затрат и результатов в денежном выражении (прибыль, рентабельность).</li>
    <li><b>Производственная</b> — выпуск продукции на единицу ресурса (производительность труда, фондоотдача).</li>
    <li><b>Социальная</b> — степень удовлетворения потребностей общества (уровень жизни, доступность услуг).</li>
    <li><b>Экологическая</b> — минимизация ущерба окружающей среде.</li>
    <li><b>Аллокативная</b> — эффективность распределения ресурсов между отраслями.</li>
  </ul>

  <p><b>Парето-эффективность</b> — состояние, при котором невозможно улучшить положение хотя бы одного субъекта, не ухудшив положение другого. Это критерий общественного оптимума.</p>

  <p><b>Показатели эффективности:</b></p>
  <ul>
    <li>производительность труда = выпуск / число работников;</li>
    <li>фондоотдача = выпуск / стоимость основных фондов;</li>
    <li>материалоёмкость = затраты материалов / выпуск;</li>
    <li>себестоимость единицы продукции;</li>
    <li>рентабельность = прибыль / затраты × 100%;</li>
    <li>срок окупаемости инвестиций.</li>
  </ul>

  <p><b>Пути повышения:</b> внедрение технологий, улучшение организации труда, повышение квалификации, экономия ресурсов, специализация, концентрация, кооперация.</p>`
},
{
  section:'know',
  title:'Дискреционная фискальная политика: стимулирующая и сдерживающая',
  body:`
  <p><b>Фискальная политика</b> — целенаправленное использование государственных расходов и налогов для воздействия на экономику.</p>

  <p><b>Дискреционная политика</b> — сознательное, целенаправленное изменение налогов и расходов по решению правительства. В отличие от неё, <b>автоматические стабилизаторы</b> (прогрессивные налоги, пособия по безработице) действуют автоматически.</p>

  <p><b>Стимулирующая фискальная политика</b> (применяется при спаде, безработице):</p>
  <ul>
    <li>рост государственных закупок (G);</li>
    <li>снижение налогов (T);</li>
    <li>рост трансфертов;</li>
    <li>результат — дефицит госбюджета, рост совокупного спроса и ВВП.</li>
  </ul>

  <p><b>Сдерживающая фискальная политика</b> (применяется при перегреве, инфляции):</p>
  <ul>
    <li>снижение государственных расходов;</li>
    <li>рост налогов;</li>
    <li>сокращение трансфертов;</li>
    <li>результат — профицит бюджета, торможение роста цен.</li>
  </ul>

  <p><b>Мультипликаторы:</b></p>
  <ul>
    <li>мультипликатор государственных закупок: <code>ΔY / ΔG = 1 / (1 − MPC)</code>;</li>
    <li>налоговый мультипликатор: <code>ΔY / ΔT = −MPC / (1 − MPC)</code>;</li>
    <li>мультипликатор трансфертов: <code>ΔY / ΔTr = MPC / (1 − MPC)</code>.</li>
  </ul>
  <p>Здесь MPC — предельная склонность к потреблению.</p>

  <p><b>Ограничения дискреционной политики:</b> лаги распознавания, принятия и воздействия; политический цикл; эффект вытеснения (рост госрасходов вытесняет частные инвестиции); рост госдолга.</p>`
},
{
  section:'know',
  title:'Кредитно-денежная политика: понятие, цели, инструменты',
  body:`
  <p><b>Кредитно-денежная (монетарная) политика</b> — комплекс мер центрального банка по регулированию денежной массы, процентных ставок и кредита для достижения макроэкономических целей.</p>

  <p><b>Цели:</b></p>
  <ul>
    <li>стабильность цен (низкая инфляция);</li>
    <li>полная занятость;</li>
    <li>устойчивый экономический рост;</li>
    <li>равновесие платёжного баланса и стабильность валютного курса.</li>
  </ul>

  <p><b>Инструменты:</b></p>
  <ul>
    <li><b>Ключевая (учётная) ставка процента</b> — ставка, по которой ЦБ кредитует коммерческие банки. Её изменение транслируется в ставки по кредитам и депозитам.</li>
    <li><b>Норма обязательных резервов</b> — доля депозитов, которую банки обязаны хранить в ЦБ. Её рост сжимает денежную массу, снижение — расширяет.</li>
    <li><b>Операции на открытом рынке</b> — покупка или продажа государственных ценных бумаг. Покупка увеличивает денежную массу, продажа — сокращает.</li>
    <li><b>Административные меры</b> — нормативы, лимиты, валютные интервенции, регулирование маржи.</li>
  </ul>

  <p><b>Виды политики:</b></p>
  <ul>

  <p><b>Ограничения:</b> «ликвидная ловушка» (при очень низких ставках политика теряет силу), временные лаги, неопределённость, неполная управляемость денежной массы.</p>`

  <p><b>Провалы рынка (фиаско рынка)</b> — ситуации, в которых рыночный механизм не обеспечивает эффективного распределения ресурсов (Парето-оптимума) и требуется вмешательство государства.</p>

    <li><b>Общественные блага.</b> Неисключаемые (нельзя запретить пользование) и неконкурентные (потребление одним не уменьшает доступность для других). Примеры: оборона, маяк, уличное освещение, правопорядок. Рынок их не производит из-за проблемы безбилетника → производит государство.</li>
    <li><b>Асимметрия информации.</b> Одна сторона знает больше. Примеры: рынок «лимонов» Дж. Акерлофа, страхование, кредитование. Решение: сигналы, сертификация, гарантии, обязательное раскрытие информации, госнадзор.</li>

    <li><b>Макроэкономическая нестабильность.</b> Безработица, инфляция, циклические кризисы. Решение: фискальная и монетарная политика.</li>

{
  section:'can',
  title:'Закон убывающей предельной полезности',
  body:`
  <p><b>Полезность</b> — субъективное удовлетворение от потребления блага. <b>Общая полезность (TU)</b> — суммарное удовлетворение от всего объёма потребления. <b>Предельная полезность (MU)</b> — прирост TU от дополнительной единицы блага: <code>MU = ΔTU / ΔQ</code>.</p>

  <p><b>Закон:</b> по мере увеличения потребления данного блага каждая дополнительная единица приносит всё меньше удовлетворения, то есть MU убывает.</p>

  <p><b>Взаимосвязь TU и MU:</b></p>
  <ul>
    <li>пока MU &gt; 0 — TU растёт;</li>
    <li>при MU = 0 — TU достигает максимума (точка насыщения);</li>
    <li>при MU &lt; 0 — TU снижается (благо становится антиблагом).</li>
  </ul>

  <p><b>Практические следствия:</b></p>
  <ul>
    <li>лежит в основе отрицательного наклона кривой спроса;</li>
    <li>объясняет условие равновесия потребителя: <code>MUx/Px = MUy/Py</code>;</li>
    <li>«парадокс воды и алмаза»: вода жизненно важна, но дёшева, потому что её много и MU низкая; алмазы редки и имеют высокую MU;</li>
    <li>используется в ценообразовании, маркетинге, страховом деле (убывающая полезность дохода).</li>
  </ul>

  <p><b>Ограничения:</b> полезность субъективна, её трудно измерить; закон не работает для некоторых благ (коллекционерство, зависимость).</p>`
},
{
  section:'can',
  title:'Закон убывающего предельного продукта',
  body:`
  <p><b>Производственная функция</b> связывает выпуск Q с затратами факторов: <code>Q = f(L, K)</code>.</p>
  <ul>
    <li><b>Общий продукт (TP)</b> — весь выпуск.</li>
    <li><b>Средний продукт (AP)</b> = TP / L.</li>
    <li><b>Предельный продукт (MP)</b> = ΔTP / ΔL — прирост выпуска от дополнительной единицы фактора.</li>
  </ul>

  <p><b>Закон:</b> при неизменности хотя бы одного фактора (обычно капитала) дополнительное применение переменного фактора (труда) сверх некоторого уровня даёт всё меньший прирост выпуска. То есть MP убывает.</p>

  <p><b>Три стадии производства:</b></p>
  <ol>
    <li><b>Растущая отдача</b> — MP растёт, AP растёт. Углубление специализации, лучшее использование оборудования.</li>
    <li><b>Убывающая отдача</b> — MP убывает, но положителен; AP достигает максимума в точке, где MP = AP, затем также убывает.</li>
    <li><b>Отрицательная отдача</b> — MP &lt; 0, TP сокращается. Перегрузка мощностей, теснота, потери.</li>
  </ol>

  <p><b>Связь с издержками:</b> когда MP падает, MC растёт; когда MP растёт, MC падает. Кривые AVC и MC имеют U-образную форму именно из-за действия этого закона.</p>

  <p><b>Пример:</b> на фиксированном участке земли один работник собирает 10 ц, второй добавляет 8 ц, третий — 5 ц, четвёртый — 2 ц, пятый может затоптать часть урожая (MP &lt; 0).</p>

  <p><b>Ограничения:</b> закон действует только в коротком периоде и только при неизменности хотя бы одного фактора. В долгосрочном периоде все факторы переменны, и работает эффект масштаба.</p>`
},
{
  section:'can',
  title:'Критерии целесообразности деятельности фирмы совершенного конкурента',
  body:`
  <p>Фирма на рынке совершенной конкуренции — ценополучатель: P = MR = AR.</p>

  <p><b>Краткосрочный период</b> (часть факторов фиксирована):</p>
  <table>
    <tr><th>Ситуация</th><th>Условие</th><th>Решение</th></tr>
    <tr><td>Экономическая прибыль</td><td>P &gt; ATC</td><td>Работать, объём при P = MC</td></tr>
    <tr><td>Нулевая прибыль</td><td>P = min ATC</td><td>Точка безубыточности, работать</td></tr>
    <tr><td>Убыток меньше FC</td><td>AVC &lt; P &lt; ATC</td><td>Работать в краткосрочном периоде</td></tr>
    <tr><td>Точка безразличия</td><td>P = min AVC</td><td>Всё равно — работать или закрыться</td></tr>
    <tr><td>Убыток больше FC</td><td>P &lt; min AVC</td><td>Закрыться</td></tr>
  </table>

  <p><b>Логика:</b> если цена покрывает переменные издержки и часть постоянных, фирма теряет меньше, чем если бы сразу закрылась (тогда потери равны всем постоянным издержкам). Если цена не покрывает даже переменные — каждый день работы увеличивает убыток, надо закрываться.</p>

  <p><b>Долгосрочный период</b> (все факторы переменны, есть вход и выход фирм):</p>
  <ul>
    <li>фирма остаётся на рынке, если P ≥ min ATC (долгосрочные средние издержки);</li>
    <li>если P &lt; min LRATC — фирма уходит;</li>
    <li>в долгосрочном равновесии экономическая прибыль равна нулю: <code>P = min LRATC = LRMC</code>.</li>
  </ul>

  <p><b>Кривая предложения фирмы</b> в краткосрочном периоде — часть кривой MC выше минимума AVC.</p>`
},
{
  section:'can',
  title:'Антимонопольная политика государства',
  body:`
  <p><b>Антимонопольная политика</b> — комплекс мер государства по защите конкуренции и ограничению монопольной власти.</p>

  <p><b>Основные направления:</b></p>
  <ul>
    <li><b>Запрет сговора</b> и картелей: фиксирование цен, раздел рынков, ограничение выпуска.</li>
    <li><b>Контроль слияний и поглощений</b>: крупные сделки требуют разрешения антимонопольного органа.</li>
    <li><b>Пресечение злоупотребления доминирующим положением</b>: завышение цен, отказ в поставке, навязывание условий, ценовая дискриминация.</li>
    <li><b>Принудительное разделение монополий</b> (например, разделение AT&amp;T в США, РАО ЕЭС в России).</li>
    <li><b>Регулирование естественных монополий</b>: тарифы, стандарты, доступ к инфраструктуре.</li>
    <li><b>Поощрение конкуренции</b>: поддержка малого и среднего бизнеса, снижение барьеров входа, дерегулирование.</li>
    <li><b>Ответственность за недобросовестную конкуренцию</b>: ложная реклама, копирование, дискредитация.</li>
  </ul>

  <p><b>Инструменты измерения монопольной власти:</b></p>
  <ul>
    <li>коэффициент Лернера: <code>L = (P − MC) / P</code>; чем ближе к 1, тем выше власть;</li>
    <li>индекс Херфиндаля–Хиршмана (HHI): сумма квадратов рыночных долей; HHI &lt; 1000 — конкурентный рынок, &gt; 1800 — высококонцентрированный.</li>
  </ul>

  <p><b>Проблемы:</b> трудно доказать сговор; глобализация размывает национальное регулирование; крупные фирмы эффективны за счёт масштаба; возможны ошибки регулятора.</p>

  <p><b>В России</b> антимонопольную политику проводит ФАС (Федеральная антимонопольная служба) на основе закона «О защите конкуренции».</p>`
},
{
  section:'can',
  title:'Государственное регулирование рынка труда',
  body:`
  <p>Рынок труда регулируется государством для защиты работников, снижения безработицы и обеспечения справедливых условий.</p>

  <p><b>Основные меры:</b></p>
  <ul>
    <li><b>Минимальный размер оплаты труда (МРОТ)</b> — нижняя граница ставки. Может создавать безработицу, если установлен выше равновесной ставки.</li>
    <li><b>Нормирование рабочего времени</b>: предельная продолжительность рабочей недели, сверхурочные, отпуска.</li>
    <li><b>Охрана труда</b>: стандарты безопасности, санитарные нормы, ответственность работодателя.</li>
    <li><b>Пособия по безработице</b> — поддержка дохода и стимул к поиску работы.</li>
    <li><b>Службы занятости</b>: информирование о вакансиях, консультирование, ярмарки вакансий.</li>
    <li><b>Программы переобучения</b> и повышения квалификации.</li>
    <li><b>Общественные и временные работы</b> для безработных.</li>
    <li><b>Антидискриминационные нормы</b>: по полу, возрасту, национальности, инвалидности.</li>
    <li><b>Регулирование профсоюзов</b> и коллективных договоров.</li>
    <li><b>Поддержка занятости в депрессивных регионах</b>.</li>
  </ul>

  <p><b>Показатели:</b> уровень безработицы = (число безработных / рабочая сила) × 100%; уровень занятости; средняя продолжительность безработицы.</p>

  <p><b>Виды безработицы:</b> фрикционная (поиск работы), структурная (изменение структуры экономики), циклическая (спад), сезонная, скрытая.</p>

  <p><b>Закон Оукена:</b> превышение фактической безработицы над естественной на 1% ведёт к потере примерно 2,5% потенциального ВВП.</p>`
},
{
  section:'can',
  title:'Показатели оценки инвестиционного проекта',
  body:`
  <p><b>Инвестиционный проект</b> — план вложения капитала с целью получения дохода. Оценка основана на дисконтировании денежных потоков.</p>

  <p><b>Основные показатели:</b></p>
  <ul>
    <li><b>NPV (чистая приведённая стоимость):</b> <code>NPV = Σ CFt / (1 + r)ᵗ − I₀</code>. Если NPV &gt; 0 — проект выгоден; NPV = 0 — на грани; NPV &lt; 0 — убыточен.</li>
    <li><b>IRR (внутренняя норма доходности):</b> ставка, при которой NPV = 0. Проект выгоден, если IRR &gt; требуемой доходности (ставки дисконта).</li>
    <li><b>PI (индекс рентабельности инвестиций):</b> <code>PI = Σ CFt / (1 + r)ᵗ / I₀</code>. PI &gt; 1 — проект выгоден.</li>
    <li><b>DPP (дисконтированный срок окупаемости):</b> период, за который дисконтированные потоки покроют вложения.</li>
    <li><b>PP (простой срок окупаемости):</b> без дисконтирования.</li>
    <li><b>ARR (учётная норма прибыли):</b> среднегодовая прибыль / средние инвестиции.</li>
  </ul>

  <p><b>Преимущества и ограничения:</b></p>
  <ul>
    <li>NPV — наиболее надёжный, но чувствителен к ставке дисконта;</li>
    <li>IRR — удобен для сравнения, но может иметь несколько значений при знакопеременных потоках;</li>
    <li>срок окупаемости прост, но игнорирует потоки после окупаемости;</li>
    <li>PI удобен при ограниченном бюджете.</li>
  </ul>

  <p><b>Дополнительно учитывают:</b> риск, инфляцию, налоги, социальные и экологические эффекты, альтернативные издержки.</p>`
},
{
  section:'can',
  title:'Распределение земельной ренты между субъектами рынка',
  body:`
  <p>Земельная рента распределяется между несколькими участниками рынка.</p>

  <ul>
    <li><b>Собственник земли</b> получает ренту (арендную плату) — плату за пользование землёй.</li>
    <li><b>Арендатор (предприниматель)</b> получает предпринимательский доход — часть прибыли сверх арендной платы, за счёт эффективного ведения хозяйства.</li>
    <li><b>Государство</b> через земельный налог изымает часть ренты в бюджет.</li>
    <li><b>Потребители продукции</b> через цены частично оплачивают ренту: чем выше цена на сельхозпродукцию, тем выше рента.</li>
    <li><b>Банки</b> — через капитализацию ренты в цену земли и ипотечные проценты.</li>
  </ul>

  <p class="note"><b>Ключевой момент:</b> предложение земли абсолютно неэластично. Поэтому налог на землю ложится в основном на собственника (не перекладывается на потребителя) и не сокращает предложение земли. Это делает земельный налог одним из самых эффективных с точки зрения экономической теории.</p>

  <p><b>Дифференциальная рента II</b> (от дополнительных вложений) в течение срока аренды присваивается арендатором, а после пересмотра договора — собственником.</p>`
},
{
  section:'can',
  title:'Как определяется экономическая эффективность отдельных видов сельхозпродукции',
  body:`
  <p>Эффективность сельхозпродукции оценивается системой натуральных и стоимостных показателей.</p>

  <p><b>Натуральные показатели:</b></p>
  <ul>
    <li>урожайность зерновых, овощей и т.д. (ц/га);</li>
    <li>продуктивность животных (надой на корову, привес, яйценоскость);</li>
    <li>выход продукции на 100 га сельхозугодий.</li>
  </ul>

  <p><b>Стоимостные показатели:</b></p>
  <ul>
    <li>себестоимость 1 ц продукции;</li>
    <li>цена реализации 1 ц;</li>
    <li>прибыль на 1 ц и на 1 га;</li>
    <li>рентабельность = (прибыль / себестоимость) × 100%;</li>
    <li>рентабельность продаж = (прибыль / выручка) × 100%.</li>
  </ul>

  <p><b>Показатели использования ресурсов:</b></p>
  <ul>
    <li>производительность труда = валовая продукция / затраты труда;</li>
    <li>трудоёмкость = затраты труда / продукция;</li>
    <li>фондоотдача, материалоёмкость, энергоёмкость;</li>
    <li>землеотдача.</li>
  </ul>

  <p><b>Сравнение:</b> показатели сравнивают с нормативами, со средними по региону, с передовыми хозяйствами, в динамике за ряд лет.</p>

  <p><b>Учёт факторов:</b> природно-климатические условия, плодородие, местоположение, специализация, технологии, цены реализации.</p>`
},
{
  section:'can',
  title:'Валовые частные внутренние инвестиции: понятие, состав, значение',
  body:`
  <p><b>Валовые частные внутренние инвестиции</b> — расходы частного сектора на приобретение и создание капитальных активов внутри страны за определённый период.</p>

  <p><b>Составные части:</b></p>
  <ul>
    <li><b>Инвестиции в основной капитал</b>: здания, сооружения, машины, оборудование, транспорт.</li>
    <li><b>Инвестиции в жилищное строительство</b>: новое жильё, реконструкция.</li>
    <li><b>Изменение запасов материальных оборотных средств</b>: сырьё, материалы, готовая продукция на складах, незавершённое производство.</li>
  </ul>

  <p><b>Формула:</b> <code>Ig = In + A</code>, где Ig — валовые инвестиции, In — чистые, A — амортизация.</p>

  <p><b>Значение для экономики:</b></p>
  <ul>
    <li>источник расширенного воспроизводства и экономического роста;</li>
    <li>создание и обновление основного капитала;</li>
    <li>рост производительности труда и конкурентоспособности;</li>
    <li>создание рабочих мест и рост доходов;</li>
    <li>база будущего потребления;</li>
    <li>входят в ВВП по расходам как компонент I.</li>
  </ul>

  <p class="note">Если чистые инвестиции &gt; 0 — расширенное воспроизводство; = 0 — простое; &lt; 0 — суженное (проедание капитала).</p>

  <p><b>Факторы, влияющие на инвестиции:</b> ставка процента, ожидаемая прибыль, налоги, технологии, наличие ресурсов, экономическая и политическая стабильность.</p>`
},
{
  section:'can',
  title:'Взаимозависимости национальных счетов',
  body:`
  <p>Система национальных счетов (СНС) — совокупность взаимосвязанных макроэкономических показателей.</p>

  <p><b>Основные показатели и переходы:</b></p>
  <ul>
    <li><b>ВВП</b> = C + I + G + NX (по расходам) = W + рента + процент + прибыль + косвенные налоги + амортизация (по доходам).</li>
    <li><b>ВНП (ВНД)</b> = ВВП + чистый факторный доход из-за рубежа (доходы резидентов за границей минус доходы нерезидентов в стране).</li>
    <li><b>ЧВП</b> = ВВП − амортизация.</li>
    <li><b>НД (национальный доход)</b> = ЧВП − косвенные налоги на бизнес.</li>
    <li><b>ЛД (личный доход)</b> = НД − взносы на соцстрах − налог на прибыль − нераспределённая прибыль + трансферты + проценты по госдолгу.</li>
    <li><b>РЛД (располагаемый личный доход)</b> = ЛД − индивидуальные налоги; распадается на потребление и сбережения.</li>
  </ul>

  <p><b>Тождества:</b></p>
  <ul>
    <li>ВВП = ВНП при отсутствии внешних факторных доходов;</li>
    <li>ЧВП = ВВП − амортизация;</li>
    <li>РЛД = C + S;</li>
    <li>утечки = инъекции: S + T + M = I + G + X.</li>
  </ul>

  <p><b>Три метода расчёта ВВП:</b></p>
  <ul>
    <li><b>По расходам:</b> C + I + G + NX.</li>
    <li><b>По доходам:</b> сумма факторных доходов + косвенные налоги + амортизация.</li>
    <li><b>По добавленной стоимости:</b> сумма добавленных стоимостей по всем отраслям.</li>
  </ul>

  <p>Все три метода дают одну и ту же величину, что отражает принцип кругооборота.</p>`
},
{
  section:'can',
  title:'Оценка уровня цен и её значение',
  body:`
  <p>Уровень цен — средневзвешенная цена товаров и услуг в экономике за период.</p>

  <p><b>Основные индексы:</b></p>
  <ul>
    <li><b>ИПЦ (индекс потребительских цен)</b> — по фиксированной потребительской корзине (индекс Ласпейреса). Отражает изменение стоимости жизни.</li>
    <li><b>Дефлятор ВВП</b> — отношение номинального ВВП к реальному (индекс Пааше). Учитывает все товары и услуги, входящие в ВВП.</li>
    <li><b>Индекс Фишера</b> — среднее геометрическое ИПЦ и дефлятора, сглаживает искажения.</li>
    <li><b>Индекс цен производителей (PPI)</b> — цены на промышленную продукцию.</li>
  </ul>

  <p><b>Формулы:</b></p>
  <ul>
    <li>ИПЦ = (стоимость корзины в текущих ценах / стоимость корзины в базовых ценах) × 100%.</li>
    <li>Дефлятор ВВП = (номинальный ВВП / реальный ВВП) × 100%.</li>
    <li>Реальный ВВП = номинальный ВВП / дефлятор × 100%.</li>
  </ul>

  <p><b>Значение:</b></p>
  <ul>
    <li>перевод номинальных показателей в реальные;</li>
    <li>измерение инфляции и покупательной способности денег;</li>
    <li>индексация доходов, пенсий, зарплат;</li>
    <li>оценка уровня жизни и динамики благосостояния;</li>
    <li>основа денежно-кредитной политики (таргетирование инфляции);</li>
    <li>сравнение стран и периодов.</li>
  </ul>

  <p><b>Ограничения:</b> корзина не учитывает новые товары и изменения качества; ИПЦ может завышать инфляцию; дефлятор зависит от структуры производства.</p>`
},
{
  section:'can',
  title:'Рассчитывать уровень инфляции',
  body:`
  <p><b>Инфляция</b> — устойчивое повышение общего уровня цен, сопровождающееся падением покупательной способности денег.</p>

  <p><b>Формулы:</b></p>
  <ul>
    <li><b>Темп инфляции за период:</b> <code>π = (P₁ − P₀) / P₀ × 100%</code>, где P — индекс цен (ИПЦ или дефлятор).</li>
    <li><b>Через дефлятор:</b> <code>π = (дефлятор₁ − дефлятор₀) / дефлятор₀ × 100%</code>.</li>
    <li><b>Среднегодовой темп</b> за n лет: <code>π = (Pₙ / P₀)^(1/n) − 1</code>.</li>
    <li><b>Уравнение Фишера:</b> <code>(1 + r) = (1 + i) / (1 + π)</code>, где r — реальная ставка, i — номинальная, π — инфляция. Приближённо: <code>r ≈ i − π</code>.</li>
    <li><b>«Правило 70»:</b> число лет удвоения цен ≈ 70 / π.</li>
  </ul>

  <p><b>Пример:</b> если ИПЦ вырос с 120 до 132, то π = (132 − 120) / 120 × 100% = 10%.</p>

  <p><b>Виды инфляции по темпу:</b></p>
  <ul>
    <li>умеренная (ползучая) — до 10% в год;</li>
    <li>галопирующая — 10–100%;</li>
    <li>гиперинфляция — свыше 50% в месяц (по Кейгану).</li>
  </ul>

  <p><b>Причины:</b> инфляция спроса (избыток денег), инфляция издержек (рост цен ресурсов), монетарные факторы, ожидания, внешние шоки.</p>

  <p><b>Последствия:</b> обесценивание сбережений, перераспределение богатства, рост неопределённости, падение реальных доходов, «инфляционный налог».</p>`
},

{
  section:'master',
  title:'Необходимость государственного регулирования экономики',
  body:`
  <p>Рыночный механизм эффективен, но не универсален. Государственное регулирование необходимо там, где рынок не справляется.</p>

  <p><b>Причины необходимости:</b></p>
  <ul>
    <li><b>Провалы рынка</b>: внешние эффекты, общественные блага, асимметрия информации, монополии.</li>
    <li><b>Социальная справедливость</b>: рынок не гарантирует достойный уровень жизни, усиливает неравенство.</li>
    <li><b>Макроэкономическая нестабильность</b>: циклы, безработица, инфляция, кризисы.</li>
    <li><b>Стратегические задачи</b>: оборона, фундаментальная наука, инфраструктура, освоение новых территорий.</li>
    <li><b>Экология</b>: защита окружающей среды, климатическая политика.</li>
    <li><b>Национальная безопасность</b>: продовольственная, энергетическая, технологическая.</li>
    <li><b>Поддержка конкуренции</b> и защита потребителя.</li>
  </ul>

  <p><b>Формы регулирования:</b></p>
  <ul>
    <li><b>Прямое</b>: законы, стандарты, лицензии, тарифы, квоты, госзаказ.</li>
    <li><b>Косвенное</b>: налоги, субсидии, ставка процента, денежная масса, валютный курс.</li>
  </ul>

  <p><b>Ограничения:</b> «провалы государства» — бюрократия, коррупция, неэффективные расходы, искажение стимулов, политический цикл. Поэтому важно найти баланс между рынком и государством.</p>

  <p><b>Современная модель</b> — смешанная экономика: рынок как основа, государство как регулятор и производитель общественных благ.</p>`
},
{
  section:'master',
  title:'Способы государственного регулирования ценообразования на рынке',
  body:`
  <p>Государство воздействует на цены прямыми и косвенными методами.</p>

  <p><b>Прямое регулирование:</b></p>
  <ul>
    <li><b>«Потолок» цены</b> — максимальная цена ниже равновесной. Последствия: рост спроса, дефицит, очереди, чёрный рынок, снижение качества. Применяется для социально значимых товаров.</li>
    <li><b>«Пол» цены</b> — минимальная цена выше равновесной. Последствия: излишек, затоваривание. Пример: МРОТ на рынке труда, минимальные цены на сельхозпродукцию.</li>
    <li><b>Регулирование тарифов естественных монополий</b>: электроэнергетика, газ, ЖКХ, железнодорожные перевозки.</li>
    <li><b>Госзакупки и товарные интервенции</b>: создание и распродажа государственных запасов.</li>
    <li><b>Заморозка цен</b> — временная мера при кризисах, обычно ведёт к дефициту.</li>
  </ul>

  <p><b>Косвенное регулирование:</b></p>
  <ul>
    <li><b>Налоги</b>: акцизы, НДС, пошлины повышают цену и сокращают объём.</li>
    <li><b>Субсидии и дотации</b> производителям снижают издержки и цену.</li>
    <li><b>Таможенные пошлины</b> — защита внутреннего рынка или пополнение бюджета.</li>
    <li><b>Антимонопольное регулирование</b> — пресечение завышения цен.</li>
    <li><b>Валютная политика</b> — влияние на импортные цены.</li>
  </ul>

  <p class="note">Эффект налога и субсидии зависит от эластичности спроса и предложения: чем менее эластична сторона, тем больше на неё ложится бремя.</p>`
},
{
  section:'master',
  title:'Факторы распределения налогового бремени между производителями и потребителями',
  body:`
  <p><b>Налоговое бремя</b> — та часть налога, которую реально несёт каждая сторона рынка.</p>

  <p><b>Главный фактор</b> — соотношение эластичностей спроса и предложения:</p>
  <ul>
    <li>Чем <b>менее эластичен спрос</b>, тем больше налога ложится на потребителя (он не может отказаться от товара).</li>
    <li>Чем <b>менее эластично предложение</b>, тем больше налога ложится на производителя.</li>
    <li>При абсолютно эластичном спросе весь налог платит производитель.</li>
    <li>При абсолютно неэластичном спросе весь налог платит потребитель.</li>
    <li>При абсолютно неэластичном предложении (например, земля) налог ложится на производителя (собственника).</li>
  </ul>

  <p><b>Формулы распределения:</b></p>
  <ul>
    <li>Доля потребителя = Es / (Es + |Ed|).</li>
    <li>Доля производителя = |Ed| / (Es + |Ed|).</li>
  </ul>
  <p>Здесь Es — эластичность предложения, Ed — эластичность спроса по цене.</p>

  <p><b>Другие факторы:</b></p>
  <ul>
    <li>тип рынка (на монополизированном рынке распределение иное);</li>
    <li>наличие товаров-заменителей;</li>

    <li>степень мобильности ресурсов.</li>
  </ul>

  <p><b>Пример:</b> акциз на сигареты (спрос неэластичен) в основном платят курильщики; налог на землю (предложение неэластично) — собственники земли.</p>`

{
  section:'master',
  title:'Условия минимизации убытков фирмой на рынке совершенной конкуренции',
  body:`
  <p>Фирма на рынке совершенной конкуренции не может влиять на цену, но может выбирать объём выпуска. Задача — минимизировать убыток или максимизировать прибыль.</p>

  <p><b>Оптимальный объём:</b> правило <code>MR = MC</code>, для совершенного конкурента <code>P = MC</code>. На этом объёме фирма либо получает максимум прибыли, либо несёт минимум убытка.</p>

  <p><b>Сравнение цены со средними издержками:</b></p>
  <table>
    <tr><th>Ситуация</th><th>Условие</th><th>Решение</th></tr>
    <tr><td>Прибыль</td><td>P &gt; ATC</td><td>Работать, выпуск при P = MC</td></tr>
    <tr><td>Нулевая прибыль</td><td>P = min ATC</td><td>Точка безубыточности</td></tr>
    <tr><td>Убыток &lt; FC</td><td>AVC &lt; P &lt; ATC</td><td>Работать в краткосрочном периоде</td></tr>
    <tr><td>Безразличие</td><td>P = min AVC</td><td>Точка закрытия</td></tr>
    <tr><td>Убыток &gt; FC</td><td>P &lt; min AVC</td><td>Закрыться</td></tr>
  </table>

  <p><b>Логика решения:</b> если цена покрывает переменные издержки и хотя бы часть постоянных, то работа приносит меньший убыток, чем немедленное закрытие (при закрытии потери равны всем постоянным издержкам). Если цена не покрывает даже переменные — каждый дополнительный выпуск увеличивает убыток, лучше закрыться.</p>

  <p><b>Пример:</b> FC = 100, AVC = 8, P = 10, ATC = 12. Фирма теряет 2 руб. на единицу, но покрывает все переменные и 2 руб. постоянных. Убыток меньше 100 → работать. Если P = 6 &lt; AVC = 8 → убыток больше 100 → закрываться.</p>

  <p><b>Кривая предложения фирмы</b> — участок MC выше минимума AVC.</p>`
},
{
  section:'master',
  title:'Регулирование деятельности естественной монополии с целью максимизации производства',
  body:`
  <p><b>Естественная монополия</b> — отрасль, где один производитель эффективнее нескольких из-за огромного положительного эффекта масштаба (электро-, газо-, водоснабжение, железные дороги).</p>

  <p><b>Проблема:</b> нерегулируемая монополия устанавливает P &gt; MC и выпускает меньше общественно оптимального объёма.</p>

  <p><b>Методы регулирования:</b></p>
  <ul>
    <li><b>P = MC (общественно оптимальный тариф).</b> Максимизирует выпуск, но так как MC &lt; AC при убывающей отдаче от масштаба, фирма несёт убытки. Требуются субсидии из бюджета.</li>
    <li><b>P = AC (безубыточный тариф).</b> Фирма покрывает издержки, объём больше монопольного, но меньше общественно оптимального. Наиболее распространён на практике.</li>
    <li><b>Двухставочный тариф.</b> Фиксированная абонентская плата (покрывает постоянные издержки) + плата по MC (покрывает переменные). Позволяет достичь эффективного объёма без субсидий.</li>
    <li><b>Регулирование нормы прибыли.</b> Ограничение рентабельности (например, не выше 10%). Риск: фирма может завышать издержки.</li>
    <li><b>Стимулирующее регулирование.</b> Фиксация цены на несколько лет: фирма получает выгоду от снижения издержек (например, RPI − X в Великобритании).</li>
    <li><b>Концессии и конкурсы за рынок.</b> Право обслуживания передаётся по конкурсу.</li>
    <li><b>Разделение монополии</b> на конкурентные и естественно-монопольные сегменты.</li>
  </ul>

  <p><b>Цель — максимизация производства</b> при доступных ценах и сохранении финансовой устойчивости отрасли.</p>`
},

{
  section:'master',
  title:'«Статистика национального дохода — мощное орудие экономической науки и анализа»',
  body:`
  <p>Это утверждение подчёркивает фундаментальную роль системы национальных счетов (СНС) в экономической науке и практике.</p>

  <p><b>Почему это так:</b></p>
  <ul>
    <li><b>Количественная база.</b> Статистика даёт числовое измерение результатов экономики: ВВП, ВНП, НД, инвестиции, потребление.</li>
    <li><b>Сравнение.</b> Позволяет сравнивать страны, регионы, периоды, оценивать динамику.</li>
    <li><b>Основа моделей.</b> Все макроэкономические модели (кейнсианская, монетаристская, DSGE) опираются на данные СНС.</li>
    <li><b>Прогнозирование.</b> Позволяет строить прогнозы, оценивать тренды, выявлять циклы.</li>
    <li><b>Оценка политики.</b> По динамике ВВП, занятости, инфляции судят об эффективности мер государства.</li>
    <li><b>Структурный анализ.</b> Показывает доли отраслей, потребления, инвестиций, экспорта.</li>
    <li><b>Уровень жизни.</b> ВВП и НД на душу населения — базовые индикаторы благосостояния.</li>
    <li><b>Международные сопоставления.</b> ВВП по ППС используется для сравнения стран.</li>
    <li><b>Бюджетная и денежная политика.</b> Правительство и ЦБ ориентируются на эти показатели.</li>
    <li><b>Научные исследования.</b> Эмпирические работы по росту, неравенству, циклам используют данные СНС.</li>
  </ul>

  <p><b>Пример:</b> гипотеза о связи инфляции и безработицы (кривая Филлипса), закон Оукена, оценки мультипликаторов — всё это проверялось на данных национальных счетов.</p>

  <p><b>Ограничения:</b> не учитывает теневую экономику, неравенство, экологический ущерб, домашний труд. Поэтому используются дополняющие показатели: ИЧР, «зелёный ВВП», индекс счастья.</p>`
},
{
  section:'master',
  title:'Почему учитываются только конечные продукты. Отличие ВВП от ВНП и ЧВП',
  body:`
  <p><b>Почему только конечные продукты.</b> Стоимость промежуточных товаров уже входит в стоимость конечных. Если суммировать и те, и другие, возникнет <b>двойной (повторный) счёт</b>, и результат будет многократно завышен.</p>

  <p><b>Два способа избежать повторного счёта:</b></p>
  <ul>
    <li>Учитывать только конечные товары и услуги.</li>
    <li>Суммировать добавленную стоимость по всем стадиям производства.</li>
  </ul>

  <p><b>Пример:</b> фермер продал пшеницу за 100, мельник — муку за 150, пекарь — хлеб за 220.</p>
  <ul>
    <li>Промежуточные: 100 + 150 = 250.</li>
    <li>Конечный продукт: 220.</li>
    <li>Добавленная стоимость: 100 + 50 + 70 = 220. Совпадает.</li>
  </ul>

  <p><b>Отличие ВВП, ВНП и ЧВП:</b></p>
  <table>
    <tr><th>Показатель</th><th>Что измеряет</th><th>Формула</th></tr>
    <tr><td><b>ВВП</b></td><td>Стоимость конечных товаров и услуг, созданных <b>внутри страны</b> всеми резидентами и нерезидентами</td><td>ВВП = C + I + G + NX</td></tr>
    <tr><td><b>ВНП</b></td><td>Стоимость конечных товаров и услуг, созданных <b>резидентами страны</b> независимо от места</td><td>ВНП = ВВП + ЧФД</td></tr>
    <tr><td><b>ЧВП</b></td><td>Чистый продукт, созданный за год, без амортизации</td><td>ЧВП = ВВП − А</td></tr>
  </table>
  <p>ЧФД — чистый факторный доход из-за рубежа; А — амортизация.</p>

  <p><b>Пример:</b> российский завод в Германии создаёт продукт, который входит в ВВП Германии, но в ВНП России.</p>

  <p><b>Смысл ЧВП:</b> амортизация — это возмещение износа капитала, а не новый доход. ЧВП показывает, сколько страна действительно может потребить, не ухудшая производственный потенциал.</p>`
},
{
  section:'master',
  title:'Критерии и показатели эффективности производства',
  body:`
  <p><b>Критерий эффективности</b> — главный признак, по которому оценивается результат: максимум выпуска при минимуме затрат, либо достижение цели с наименьшими ресурсами.</p>

  <p><b>Классификация показателей:</b></p>

  <p><b>1. Показатели использования труда:</b></p>
  <ul>
    <li>производительность труда = выпуск / численность (или / чел.-час);</li>
    <li>трудоёмкость = затраты труда / выпуск;</li>
    <li>выработка на одного работающего.</li>
  </ul>

  <p><b>2. Показатели использования основных фондов:</b></p>
  <ul>
    <li>фондоотдача = выпуск / стоимость ОФ;</li>
    <li>фондоёмкость = стоимость ОФ / выпуск;</li>
    <li>коэффициент обновления и выбытия ОФ.</li>
  </ul>

  <p><b>3. Показатели использования материалов и энергии:</b></p>
  <ul>
    <li>материалоёмкость = затраты материалов / выпуск;</li>
    <li>энергоёмкость, топливоёмкость.</li>
  </ul>

  <p><b>4. Стоимостные показатели:</b></p>
  <ul>
    <li>себестоимость единицы продукции;</li>
    <li>прибыль на 1 рубль затрат;</li>
    <li>рентабельность продукции = прибыль / себестоимость;</li>
    <li>рентабельность продаж = прибыль / выручка;</li>
    <li>рентабельность активов (ROA), капитала (ROE).</li>
  </ul>

  <p><b>5. Инвестиционные показатели:</b></p>
  <ul>
    <li>срок окупаемости;</li>
    <li>NPV, IRR, PI.</li>
  </ul>

  <p><b>6. Обобщающие:</b></p>
  <ul>
    <li>рост ВВП на душу населения;</li>
    <li>производительность общественного труда;</li>
    <li>Парето-эффективность;</li>
    <li>ресурсоотдача и ресурсосбережение.</li>
  </ul>

  <p><b>Пути повышения:</b> НТП, автоматизация, улучшение организации, мотивация персонала, экономия ресурсов, специализация и кооперация.</p>`
},
{
  section:'master',
  title:'Пути повышения эффективности сельскохозяйственного производства',
  body:`
  <p>Сельское хозяйство зависит от природных условий, имеет длительный цикл и низкую скорость оборота капитала. Это определяет специфические пути повышения эффективности.</p>

  <p><b>Интенсификация:</b></p>
  <ul>
    <li>применение минеральных и органических удобрений;</li>
    <li>средства защиты растений и животных;</li>
    <li>мелиорация, орошение, осушение;</li>
    <li>точное земледелие, GPS-навигация, дроны.</li>
  </ul>

  <p><b>Технико-технологические:</b></p>
  <ul>
    <li>механизация и автоматизация всех процессов;</li>
    <li>современная энергоэффективная техника;</li>
    <li>цифровые платформы управления хозяйством;</li>
    <li>ресурсосберегающие технологии (no-till, минимальная обработка).</li>

  <p><b>Биологические:</b></p>
  <ul>
    <li>селекция и генетика: высокоурожайные сорта, продуктивные породы;</li>
    <li>биотехнологии, генная инженерия (с учётом регулирования);</li>
    <li>защита от болезней и вредителей.</li>
  </ul>

  <p><b>Организационно-экономические:</b></p>
  <ul>
    <li>специализация и концентрация производства;</li>

    <li>развитие фермерских и крупных хозяйств;</li>
    <li>совершенствование логистики и хранения (снижение потерь);</li>

  <p><b>Государственная поддержка:</b></p>

  <p><b>Социальные:</b> повышение квалификации, улучшение условий труда и жизни на селе, привлечение молодёжи.</p>`
},
{
  section:'master',
  title:'Рыночные отношения в сельском хозяйстве',
  body:`
  <p>Сельское хозяйство обладает рядом особенностей, которые определяют специфику рыночных отношений в отрасли.</p>

  <p><b>Особенности:</b></p>
  <ul>
    <li><b>Земля — главное средство производства.</b> Ограничена, не воспроизводима, различается по плодородию и местоположению.</li>
    <li><b>Сильная зависимость от природно-климатических условий.</b> Урожайность и объёмы колеблются, что ведёт к нестабильности предложения и цен.</li>
    <li><b>Сезонность производства</b> и длительный производственный цикл. Капитал оборачивается медленно.</li>
    <li><b>Спрос на продовольствие малоэластичен.</b> Люди не могут резко увеличить или уменьшить потребление еды при изменении цен.</li>
    <li><b>Колебания предложения</b> при неэластичном спросе вызывают сильные колебания цен (паутинообразная модель).</li>
    <li><b>Множество мелких товаропроизводителей</b> — слабая рыночная власть, низкая переговорная сила.</li>
    <li><b>Высокая доля постоянных издержек</b>, значительные риски.</li>
    <li><b>Скоропортящаяся продукция</b> требует развитой логистики и хранения.</li>
    <li><b>Тесная связь с перерабатывающей промышленностью</b> (АПК).</li>
  </ul>

  <p><b>Следствия для рынка:</b></p>
  <ul>
    <li>необходимость государственной поддержки и регулирования;</li>
    <li>развитие кооперации и вертикальной интеграции;</li>
    <li>использование форвардных и фьючерсных контрактов для снижения ценовых рисков;</li>
    <li>интервенции государства для стабилизации цен;</li>
    <li>развитие страхования урожая и доходов;</li>
    <li>поддержка экспорта сельхозпродукции.</li>
  </ul>

  <p><b>Формы хозяйствования:</b> крупные агрохолдинги, кооперативы, фермерские хозяйства, личные подсобные хозяйства. Каждая форма имеет свою нишу и особенности.</p>`
},
{
  section:'master',
  title:'Последствия и значение инфляции',
  body:`
  <p><b>Инфляция</b> — устойчивый рост общего уровня цен и падение покупательной способности денег.</p>

  <p><b>Отрицательные последствия:</b></p>
  <ul>
    <li><b>Падение реальных доходов</b> при фиксированных номинальных (зарплаты, пенсии, стипендии).</li>
    <li><b>Обесценивание сбережений</b> — вклады теряют покупательную способность.</li>
    <li><b>Перераспределение богатства</b>: должники выигрывают (долг обесценивается), кредиторы и владельцы сбережений теряют.</li>
    <li><b>«Инфляционный налог»</b> — потеря покупательной способности денег у населения.</li>
    <li><b>Рост неопределённости</b> → сокращение инвестиций, вывоз капитала, «бегство от денег».</li>
    <li><b>Искажение ценовых сигналов</b>, трудности планирования.</li>
    <li><b>Снижение конкурентоспособности экспорта</b> при инфляции выше, чем у партнёров.</li>
    <li><b>При гиперинфляции</b> — разрушение хозяйственных связей, бартер, долларизация, падение производства.</li>
    <li><b>Социальная напряжённость</b>, падение доверия к власти и деньгам.</li>
  </ul>

  <p><b>Положительные или нейтральные стороны (умеренная инфляция 2–4%):</b></p>
  <ul>
    <li>стимулирует потребление и инвестиции (деньги «невыгодно» держать);</li>
    <li>снижает реальную величину долгов, в том числе государственного;</li>
    <li>позволяет корректировать относительные цены и зарплаты;</li>
    <li>сигнализирует о дисбалансах в экономике.</li>
  </ul>

  <p><b>Методы борьбы:</b></p>
  <ul>
    <li><b>Денежно-кредитная политика</b>: рост ставки, сжатие денежной массы, продажа ценных бумаг.</li>
    <li><b>Фискальная политика</b>: сокращение госрасходов, рост налогов.</li>
    <li><b>Индексация доходов</b> для защиты населения.</li>
    <li><b>Таргетирование инфляции</b> — публичное объявление цели по инфляции (например, 4% в России).</li>
    <li><b>Борьба с монополиями</b> и инфляцией издержек.</li>
    <li><b>Валютная политика</b>: укрепление рубля снижает импортные цены.</li>
  </ul>

  <p><b>Вывод:</b> умеренная предсказуемая инфляция допустима; галопирующая и гиперинфляция разрушительны.</p>`
},
{
  section:'master',
  title:'Особенности формирования спроса и предложения земли',
  body:`
  <p>Земля как фактор производства обладает уникальными свойствами, которые определяют специфику её рынка.</p>

  <p><b>Предложение земли:</b></p>
  <ul>
    <li><b>Фиксировано</b> природой — количество земли нельзя увеличить;</li>
    <li>поэтому кривая предложения <b>абсолютно неэластична</b> (вертикальная линия);</li>
    <li>на предложение влияют только долгосрочные факторы: мелиорация, вовлечение новых территорий, изменение целевого назначения;</li>
    <li>собственник не может «произвести» больше земли в ответ на рост цены.</li>
  </ul>

  <p><b>Спрос на землю:</b></p>
  <ul>
    <li><b>Производный</b> — зависит от спроса на продукцию, производимую на земле;</li>
    <li>определяется доходностью участка: <code>MRP земли = MR × MP земли</code>;</li>
    <li>зависит от цены продукции, технологий, цен на другие ресурсы;</li>
    <li>кривая спроса имеет отрицательный наклон: чем ниже рента, тем больше земли готовы арендовать.</li>
  </ul>

  <p><b>Равновесие на рынке земли:</b> пересечение вертикальной кривой предложения и убывающей кривой спроса. Рента определяется исключительно спросом.</p>

  <p><b>Цена земли</b> — капитализированная рента:</p>
  <p><code>Цена земли = Рента / Ставка процента × 100%</code></p>
  <p>Например, если рента = 1000 руб./год, ставка = 5%, цена = 20 000 руб.</p>

  <p><b>Виды ренты:</b> абсолютная, дифференциальная I и II, монопольная.</p>

  <p><b>Налог на землю.</b> Поскольку предложение неэластично, налог ложится на собственника и не сокращает предложение — это один из самых эффективных налогов.</p>

  <p><b>Особенности рынка земли в России:</b> государственная регистрация, категории земель, ограничения на иностранную собственность, земельный налог, аренда муниципальной земли.</p>`
},
{
  section:'master',
  title:'Особенности ренты как платы за активы (ресурсы)',
  body:`
  <p><b>Рента</b> — доход, получаемый владельцем ресурса с абсолютно неэластичным предложением, например земли. Это плата за пользование ресурсом, которая не влияет на его предложение.</p>

  <p><b>Ключевые особенности:</b></p>
  <ul>
    <li><b>Определяется спросом.</b> Так как предложение фиксировано, величина ренты целиком зависит от спроса на ресурс и его производительности.</li>
    <li><b>Не влияет на предложение.</b> Даже при нулевой ренте земля не исчезнет. Поэтому рента не увеличивает количество ресурса.</li>
    <li><b>Чистая экономическая рента</b> — избыточный доход сверх минимальной платы, необходимой для вовлечения ресурса в производство. Часто называют «незаработанным доходом».</li>
    <li><b>Капитализация.</b> Рента превращается в цену актива: <code>Цена = Рента / r</code>. Чем выше рента и ниже ставка, тем дороже актив.</li>
    <li><b>Не тождественна арендной плате.</b> Арендная плата включает ренту плюс амортизацию улучшений, налоги и другие платежи.</li>
    <li><b>Налогообложение.</b> Налог на ренту не искажает распределение ресурсов, так как не меняет предложение.</li>
  </ul>

  <p><b>Виды ренты:</b></p>
  <ul>
    <li><b>Абсолютная</b> — со всех участков из-за монополии собственности;</li>
    <li><b>Дифференциальная I</b> — из-за различий плодородия и местоположения;</li>
    <li><b>Дифференциальная II</b> — от дополнительных вложений капитала;</li>
    <li><b>Монопольная</b> — на уникальные ресурсы.</li>
  </ul>

  <p><b>Аналогия для других ресурсов.</b> Рента возникает не только на землю: например, на уникальный талант, редкий ресурс, месторождение, выгодное местоположение. Это «квазирента» — доход, привязанный к ограниченному фактору.</p>

  <p><b>Практическое значение:</b> земельный налог, плата за недра, аренда, оценка природных ресурсов, концессии, лесная и водная рента.</p>`
}
];

/* ================= ЛОГИКА ================= */
const SECTIONS = [
  {id:'know',   label:'Знать'},
  {id:'can',    label:'Уметь'},
  {id:'master', label:'Владеть'}
];
const LS_LEARNED = 'econ.learned.v1';
const LS_THEME   = 'econ.theme.v1';

const counters = {know:0, can:0, master:0};
const tmp = document.createElement('div');
DATA.forEach(d => {
  d.n = ++counters[d.section];
  tmp.innerHTML = d.body;
  d.plain = (d.title + ' ' + tmp.textContent).toLowerCase();
});

let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(LS_LEARNED) || '[]')); } catch (e) {}

let openIds = new Set();
let activeSection = 'all';
let query = '';

const listEl   = document.getElementById('list');
const searchEl = document.getElementById('search');
const barFill  = document.getElementById('barFill');
const progText = document.getElementById('progressText');

function render(){
  const q = query.trim().toLowerCase();
  let html = '';

  SECTIONS.forEach(sec => {
    if (activeSection !== 'all' && activeSection !== sec.id) return;

    const items = DATA.filter(d =>
      d.section === sec.id && (!q || d.plain.includes(q))
    );
    if (!items.length) return;

    const doneCount = items.filter(d => learned.has(d.id)).length;

    html += '<div class="sec-head"><span class="sec-name">' + sec.label + '</span>' +
            '<span class="sec-meta">' + doneCount + ' / ' + items.length + '</span></div>';

    items.forEach(d => {
      const isDone = learned.has(d.id);
      const isOpen = openIds.has(d.id);
      html +=
        '<article class="card' + (isDone ? ' done' : '') + (isOpen ? ' open' : '') + '" data-id="' + d.id + '">' +
          '<div class="q" role="button" tabindex="0" aria-expanded="' + isOpen + '">' +
            '<span class="num">' + d.n + '</span>' +
            '<span class="qtitle">' + d.title + '</span>' +
            '<span class="chev"></span>' +
          '</div>' +
          '<div class="a"><div class="a-in">' +
            '<div class="a-body">' + d.body + '</div>' +
            '<button class="learn" data-learn="' + d.id + '">' +
              (isDone ? '✓ Изучено' : 'Отметить изученным') +
            '</button>' +
          '</div></div>' +
        '</article>';
    });
  });

  listEl.innerHTML = html || '<p class="empty">Ничего не найдено 🔍</p>';
  updateProgress();
}

function updateProgress(){
  const total = DATA.length;
  let done = 0;
  DATA.forEach(d => { if (learned.has(d.id)) done++; });
  const pct = total ? Math.round(done / total * 100) : 0;
  barFill.style.width = pct + '%';
  progText.textContent = done + ' из ' + total + ' · ' + pct + '%';
}

function saveLearned(){
  try { localStorage.setItem(LS_LEARNED, JSON.stringify([...learned])); } catch (e) {}
}

listEl.addEventListener('click', e => {
  const learnBtn = e.target.closest('.learn');
  if (learnBtn){
    const id = learnBtn.dataset.learn;
    if (learned.has(id)) learned.delete(id); else learned.add(id);
    saveLearned();
    render();
    return;
  }
  const qEl = e.target.closest('.q');
  if (qEl){
    const card = qEl.closest('.card');
    const id = card.dataset.id;
    const open = card.classList.toggle('open');
    qEl.setAttribute('aria-expanded', open);
    if (open) openIds.add(id); else openIds.delete(id);
  }
});

listEl.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('q')){
    e.preventDefault();
    e.target.click();
  }
});

searchEl.addEventListener('input', () => {
  query = searchEl.value;
  render();
});

document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeSection = chip.dataset.sec;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
  render();
});

document.getElementById('collapseBtn').addEventListener('click', () => {
  openIds.clear();
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Сбросить весь прогресс?')) return;
  learned.clear();
  saveLearned();
  render();
});

const themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(LS_THEME, t); } catch (e) {}
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

render();
</script>
</body>
</html>
